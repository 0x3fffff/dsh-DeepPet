<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>dsh-DeepPet</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="pet">
      <div id="bubble" class="bubble"></div>
      <img id="pet-img" draggable="false" alt="pet" />
      <video id="pet-video" muted playsinline></video>
      <video id="pet-video-b" muted playsinline></video>
      <div id="menu">
        <div class="menu-item" id="menu-settings"><span class="menu-icon">⚙</span>设置</div>
        <!-- 测试面板只在 DSH_PET_DEBUG 下露出：它是开发用的，社区版本的右键
             菜单不该有它。功能本身还在（Rust 的 open_test 命令和调试通道都在），
             test/panel.mjs 走的也是调试通道而不是这个按钮。 -->
        <div class="menu-item" id="menu-test" hidden><span class="menu-icon">🎬</span>测试面板</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
