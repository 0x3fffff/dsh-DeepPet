<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>dsh-deep-pet 设置</title>
    <link rel="stylesheet" href="/src/settings.css" />
  </head>
  <body>
    <main class="page">
      <section>
        <h2>大小</h2>
        <div class="row">
          <label class="slider-label" for="petScale">桌宠</label>
          <input type="range" id="petScale" min="50" max="200" step="5" />
          <output id="petScaleLabel"></output>
        </div>
        <div class="row">
          <label class="slider-label" for="bubbleScale">气泡</label>
          <input type="range" id="bubbleScale" min="50" max="200" step="5" />
          <output id="bubbleScaleLabel"></output>
        </div>
        <p class="hint" id="scaleHint">拖动时桌宠实时跟着变，松手才保存。</p>
      </section>

      <section>
        <h2>气泡样式</h2>
        <div id="styles" class="styles"></div>
      </section>

      <section>
        <h2>气泡时长</h2>
        <div class="row">
          <input type="range" id="bubbleMs" min="2000" max="15000" step="500" />
          <output id="bubbleMsLabel"></output>
        </div>
        <p class="hint">完成动画会按这个时长自适应播放速度，始终完整播完。</p>
      </section>

      <section>
        <h2>台词</h2>
        <label class="check"><input type="checkbox" id="lines" /> 让桌宠自己说话</label>
        <p class="hint">
          关掉就回到纯信息播报。想改台词或称呼：把 <code>台词.json</code> 复制到
          <code>%LOCALAPPDATA%</code> 下的 <code>com.dsh.deeppet\lines.json</code>，
          存在就整体替换内置的那份。
        </p>
      </section>

      <section>
        <h2>音效</h2>
        <label class="check"><input type="checkbox" id="sound" /> 任务完成时播放音效</label>
      </section>

      <section>
        <h2>余额提醒</h2>
        <label class="check"><input type="checkbox" id="balanceAlert" /> 余额不足时提醒我</label>
        <div class="row" id="balanceRow">
          <label class="slider-label" for="balanceThreshold">低于</label>
          <input type="number" id="balanceThreshold" min="0" max="9999" step="1" />
          <span class="unit">时提醒</span>
        </div>
      </section>

      <section>
        <h2>操作</h2>
        <div class="row">
          <button id="resetPos">重置桌宠位置</button>
          <button id="quit" class="danger">退出桌宠</button>
          <button id="quitDsh" class="danger">退出 DSH</button>
        </div>
        <p class="hint">
          桌宠被拖到已拔掉的显示器上找不回来时，用「重置位置」把它叫回主屏右下角。
          「退出 DSH」会关掉整个 DSH（连同正在跑的任务和桌宠自己），需要点两次确认。
        </p>
      </section>

      <p id="status" class="status"></p>
    </main>
    <script type="module" src="/src/settings.ts"></script>
  </body>
</html>
