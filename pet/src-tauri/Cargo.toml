[package]
name = "dsh-deep-pet"
version = "0.3.0"
description = "dsh-DeepPet desktop pet window"
edition = "2021"

[lib]
name = "dsh_deep_pet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
